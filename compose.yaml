services:
  mymusic:
    build: .
    container_name: mymusic
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - APP_NAME=${APP_NAME:-MyMusic}
      - DATA_DIR=/app/data
      - MUSIC_DIR=/app/music
    volumes:
      - ./data:/app/data
      - ./music:/app/music
    restart: unless-stopped
